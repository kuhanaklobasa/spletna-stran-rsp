<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pekarna Malort - Ponudba</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style-ponudba.css">
</head>
<body>

    <!-- Glava -->
    <header class="container-fluid py-4 border-bottom border-warning-subtle">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="naslov m-0">Pekarna Malort</h1>
            
            <div class="text-end">
                <a href="index.html">
                    <img src="kruhek.png" alt="" class="img-fluid rounded">
                </a>
                <small class="d-block mt-1 fw-bold">Klikni za domov &#x21B0;</small>
            </div>
        </div>
    </header>

    <!-- Ponudba z Bootstrap Card-i -->
    <main class="container my-5">
        <div class="row g-4 justify-content-center">
            
            <!-- Kartica 1: Buhtelji -->
            <div class="col-12 col-md-4">
                <div class="card border-0 rounded-4 p-2 h-100">
                    <img src="https://placehold.co/400x250/5C3210/FFF?text=Buhtelji" class="card-img-top rounded-4" alt="Buhtelji">
                    <div class="card-body px-1">
                        <h2 class="card-title fw-bold">Buhtelji</h2>
                        <p class="card-text fs-4 mb-1">5 €</p>
                        <p class="card-text opacity-75 small">Mehki in okusni</p>
                    </div>
                </div>
            </div>

            <!-- Kartica 2: Kruh -->
            <div class="col-12 col-md-4">
                <div class="card border-0 rounded-4 p-2 h-100">
                    <img src="https://placehold.co/400x250/5C3210/FFF?text=Kruh" class="card-img-top rounded-4" alt="Kruh">
                    <div class="card-body px-1">
                        <h2 class="card-title fw-bold">Kruh</h2>
                        <p class="card-text fs-4 mb-1">2 €</p>
                        <p class="card-text opacity-75 small">Domače</p>
                    </div>
                </div>
            </div>

            <!-- Kartica 3: Drobno pecivo -->
            <div class="col-12 col-md-4">
                <div class="card border-0 rounded-4 p-2 h-100">
                    <img src="https://placehold.co/400x250/5C3210/FFF?text=Drobno+pecivo" class="card-img-top rounded-4" alt="Drobno pecivo">
                    <div class="card-body px-1">
                        <h2 class="card-title fw-bold">Drobno<br>pecivo</h2>
                        <p class="card-text fs-4 mb-1">3 €</p>
                        <p class="card-text opacity-75 small">Sladko in slastno</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Paginacija -->
        <div class="d-flex justify-content-center align-items-center gap-2 mt-5 paginacija">
            <a href="#" class="text-decoration-none me-2">&larr; Previous</a>
            <span class="stran aktivna">1</span>
            <a href="#" class="stran">2</a>
            <a href="#" class="stran">3</a>
            <span>...</span>
            <a href="#" class="stran">67</a>
            <a href="#" class="stran">68</a>
            <a href="#" class="text-decoration-none ms-2">Next &rarr;</a>
        </div>
    </main>

</body>
</html>
